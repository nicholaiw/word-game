<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Letter Timer</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: none;
    -ms-touch-action: none;
    background: #fafafa;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
  }

  .board {
    display: flex;
    flex-wrap: wrap;
    align-content: center;
    justify-content: center;
    width: 100%;
    height: 100%;
    padding: 3vmin;
  }

  .letter {
    border: 1px solid #ccc;
    border-radius: 18%;
    background: #fff;
    color: #222;
    font-weight: 500;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    user-select: none;
    transition: background 0.15s, color 0.15s, border-color 0.15s;
  }

  .letter:active {
    border-color: #888;
  }

  .letter.grayed {
    background: #ddd;
    color: #aaa;
    border-color: #ddd;
  }

  /* Number shown only while dragging to set duration */
  .drag-readout {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0.9);
    font-size: 16vmin;
    font-weight: 600;
    color: #333;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.15s, transform 0.15s;
    z-index: 6;
  }

  .drag-readout.visible {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
  }

  /* Full-screen flash overlay */
  .flash-overlay {
    position: fixed;
    inset: 0;
    background: #d33;
    opacity: 0;
    pointer-events: none;
    z-index: 10;
  }

  .flash-overlay.blink {
    animation: blink 0.5s steps(1, end) 3;
  }

  .flash-overlay.solid {
    opacity: 1;
    transition: opacity 0.15s;
  }

  @keyframes blink {
    0%, 49%   { opacity: 1; }
    50%, 100% { opacity: 0; }
  }
</style>
</head>
<body>

<div class="board" id="board"></div>
<div class="drag-readout" id="dragReadout">3</div>
<div class="flash-overlay" id="flash"></div>

<script>
  const board = document.getElementById('board');
  const flash = document.getElementById('flash');
  const dragReadout = document.getElementById('dragReadout');
  const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split('');

  const GAP_VMIN = 1.4;

  const STORAGE_KEY = 'letterTimerSeconds';
  let seconds = parseInt(localStorage.getItem(STORAGE_KEY), 10) || 3;
  let intervalId = null;

  function saveSeconds() {
    localStorage.setItem(STORAGE_KEY, seconds);
  }

  // --- Layout: pick a grid (cols x rows) that best fills the viewport for 26 items,
  //     rendered with flexbox so an incomplete last row is centered automatically ---
  function layoutBoard() {
    const w = window.innerWidth;
    const h = window.innerHeight;
    const gapPx = (GAP_VMIN / 100) * Math.min(w, h);
    const padPx = (3 / 100) * Math.min(w, h);

    let bestCols = 6, bestSize = 0;
    for (let cols = 1; cols <= 26; cols++) {
      const rows = Math.ceil(26 / cols);
      const availW = w - padPx * 2 - gapPx * (cols - 1);
      const availH = h - padPx * 2 - gapPx * (rows - 1);
      const size = Math.min(availW / cols, availH / rows);
      if (size > bestSize) {
        bestSize = size;
        bestCols = cols;
      }
    }

    const cellSize = Math.max(bestSize, 20);
    const fontSize = cellSize * 0.42;

    board.style.gap = gapPx + 'px';

    // Preserve existing grayed/white state across relayouts (e.g. rotation)
    const grayedSet = new Set(
      Array.from(board.querySelectorAll('.letter.grayed')).map(el => el.textContent)
    );

    board.innerHTML = '';

    letters.forEach((letter) => {
      const el = document.createElement('div');
      el.className = 'letter';
      if (grayedSet.has(letter)) el.classList.add('grayed');
      el.textContent = letter;
      el.style.width = cellSize + 'px';
      el.style.height = cellSize + 'px';
      el.style.fontSize = fontSize + 'px';
      el.addEventListener('click', () => onLetterClick(el));
      board.appendChild(el);
    });
  }

  function runFlashThenReset() {
    flash.classList.add('blink');
    setTimeout(() => {
      flash.classList.remove('blink');
      flash.classList.add('solid');
      setTimeout(() => {
        flash.classList.remove('solid');
        document.querySelectorAll('.letter.grayed').forEach(el => el.classList.remove('grayed'));
      }, 250);
    }, 500);
  }

  function startTimer() {
    clearInterval(intervalId);
    let remaining = seconds;
    intervalId = setInterval(() => {
      remaining--;
      if (remaining <= 0) {
        clearInterval(intervalId);
        if (navigator.vibrate) navigator.vibrate(200);
        runFlashThenReset();
      }
    }, 1000);
  }

  function onLetterClick(el) {
    if (dragMoved) return; // ignore click that follows a drag gesture

    el.classList.toggle('grayed');
    startTimer(); // any tap — gray or white — restarts the countdown at full duration
  }

  // --- Drag up/down anywhere to set the duration ---
  let dragging = false;
  let dragMoved = false;
  let dragStartY = 0;
  let dragStartSeconds = seconds;
  const PX_PER_SECOND = 18;

  function showReadout(value) {
    dragReadout.textContent = value;
    dragReadout.classList.add('visible');
  }

  function hideReadout() {
    dragReadout.classList.remove('visible');
  }

  function onPointerDown(e) {
    dragging = true;
    dragMoved = false;
    dragStartY = e.clientY;
    dragStartSeconds = seconds;
  }

  function onPointerMove(e) {
    if (!dragging) return;
    const deltaY = dragStartY - e.clientY; // up = positive
    if (Math.abs(deltaY) > 6) {
      dragMoved = true;
    }
    if (!dragMoved) return;
    const change = Math.round(deltaY / PX_PER_SECOND);
    seconds = Math.max(1, dragStartSeconds + change);
    showReadout(seconds);
  }

  function onPointerUp() {
    if (!dragging) return;
    dragging = false;
    if (dragMoved) {
      saveSeconds();
    }
    hideReadout();
    // Let click handler check dragMoved first, then reset it
    setTimeout(() => { dragMoved = false; }, 0);
  }

  document.addEventListener('pointerdown', onPointerDown);
  document.addEventListener('pointermove', onPointerMove);
  document.addEventListener('pointerup', onPointerUp);
  document.addEventListener('pointercancel', onPointerUp);

  // Extra safety net against pinch-zoom / double-tap-zoom on mobile browsers
  document.addEventListener('gesturestart', (e) => e.preventDefault());
  let lastTouchEnd = 0;
  document.addEventListener('touchend', (e) => {
    const now = Date.now();
    if (now - lastTouchEnd <= 300) {
      e.preventDefault();
    }
    lastTouchEnd = now;
  }, { passive: false });

  window.addEventListener('resize', layoutBoard);

  layoutBoard();
</script>

</body>
</html>
